<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Center Fit - Ciodarofitness</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-bronze-gradient {
            background: linear-gradient(135deg, #d4af37 0%, #aa771c 50%, #8a5812 100%);
        }
        .text-bronze {
            color: #d4af37;
        }
        .border-bronze-focus:focus {
            border-color: #d4af37;
        }
        .badge-border {
            border: 1px solid rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen flex items-center justify-center p-4">

    <div id="vista-login" class="max-w-md w-full bg-[#131b2e] p-7 rounded-[2rem] border border-gray-800/80 shadow-2xl relative overflow-hidden transition-all duration-300">
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-bronze-gradient"></div>

        <div class="text-center space-y-3 mb-8 mt-2">
            <div class="inline-block bg-[#0b0f19] badge-border px-3.5 py-1 rounded-full">
                <span class="text-[10px] tracking-widest text-bronze uppercase font-bold">SAAS ENGINE V2.5</span>
            </div>

            <div class="space-y-0.5">
                <h1 class="text-2xl font-black tracking-widest text-white">BUSINESS CENTER</h1>
                <h2 class="text-2xl font-extrabold text-bronze tracking-wide">FIT</h2>
            </div>

            <div class="inline-block bg-[#0b0f19] badge-border px-4 py-1 rounded-full mt-1">
                <span class="text-[9px] tracking-[0.2em] text-gray-300 uppercase font-semibold">BY CIODAROFITNESS</span>
            </div>
        </div>

        <form onsubmit="iniciarSesionDirecta(event)" class="space-y-5">
            <div>
                <label class="text-[11px] text-gray-400 block mb-1.5 uppercase font-bold tracking-wider">Correo Electrónico</label>
                <input type="email" id="correo" required value="heber@ciodarofitness.com" class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl p-3.5 text-sm focus:outline-none border-bronze-focus text-white placeholder-gray-600 transition">
            </div>

            <div>
                <label class="text-[11px] text-gray-400 block mb-1.5 uppercase font-bold tracking-wider">Contraseña</label>
                <div class="relative">
                    <input type="password" id="password" required value="123456" class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl p-3.5 text-sm focus:outline-none border-bronze-focus text-white pr-12 placeholder-gray-600 transition">
                    <button type="button" onclick="togglePassword()" class="absolute right-3.5 top-3.5 text-base text-gray-400 hover:text-white transition">🙈</button>
                </div>
            </div>

            <button type="submit" class="w-full bg-bronze-gradient hover:opacity-95 text-gray-950 font-black py-3.5 px-4 rounded-xl transition duration-200 shadow-xl shadow-amber-950/20 uppercase tracking-widest text-xs mt-3">
                Acceder al Sistema
            </button>
        </form>

        <div class="text-center pt-6 mt-2 border-t border-gray-800/50">
            <a href="https://wa.me/584123456789?text=Hola,%20deseo%20solicitar%20una%20licencia%20para%20Business%20Center%20Fit" target="_blank" class="text-xs text-bronze hover:underline font-semibold tracking-wide inline-flex items-center gap-1.5">
                <span>Portal de Afiliados / Solicitar Licencia</span> ↗
            </a>
        </div>
    </div>

    <div id="vista-panel" class="max-w-md w-full bg-[#131b2e] p-7 rounded-[2rem] border border-gray-800/80 shadow-2xl relative overflow-hidden hidden space-y-6">
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-bronze-gradient"></div>

        <div class="flex justify-between items-center mt-2">
            <div>
                <h2 class="text-lg font-black tracking-wider text-white">BUSINESS CENTER</h2>
                <p class="text-xs text-bronze font-bold">PANEL DE CONTROL</p>
            </div>
            <button onclick="cerrarSesion()" class="bg-[#0b0f19] border border-gray-800 text-gray-400 hover:text-white text-xs px-3 py-1.5 rounded-xl transition">
                Salir ↩
            </button>
        </div>

        <div class="bg-[#0b0f19] p-5 rounded-2xl border border-gray-800 text-center space-y-2">
            <p class="text-xs text-gray-400 uppercase tracking-widest">Estado de Licencia</p>
            <p class="text-sm font-bold text-emerald-400">Activa & Conectada (SaaS Engine)</p>
        </div>

        <div class="text-center py-6 text-gray-400 text-xs">
            Sistema listo para la gestión de tus clientes y finanzas con estética profesional.
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function iniciarSesionDirecta(e) {
            e.preventDefault();
            // Transición limpia sin alertas molestas
            document.getElementById('vista-login').classList.add('hidden');
            document.getElementById('vista-panel').classList.remove('hidden');
        }

        function cerrarSesion() {
            document.getElementById('vista-panel').classList.add('hidden');
            document.getElementById('vista-login').classList.remove('hidden');
        }
    </script>
</body>
</html>
