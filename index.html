<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Center Fit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-gold-gradient {
            background: linear-gradient(135deg, #d4af37 0%, #aa771c 100%);
        }
        .text-gold {
            color: #d4af37;
        }
        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen p-4 flex items-center justify-center">

    <div id="vista-login" class="max-w-md w-full bg-[#131b2e] p-6 rounded-3xl border border-gray-800 shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-gold-gradient"></div>

        <div class="text-center space-y-1 mb-6 mt-2">
            <span class="bg-[#d4af37]/10 text-gold border border-[#d4af37]/20 text-[10px] font-semibold px-3 py-1 rounded-full">SAAS ENGINE V2.5</span>
            <h1 class="text-2xl font-black tracking-wider text-white mt-2">BUSINESS CENTER</h1>
            <h2 class="text-xl font-bold text-gold">FIT</h2>
            <p class="text-[10px] tracking-widest text-gray-400 uppercase font-semibold">ADMINISTRADOR CIODAROFITNESS</p>
        </div>

        <form onsubmit="realizarLogin(event)" class="space-y-4">
            <div>
                <label class="text-xs text-gray-400 block mb-1 uppercase font-semibold tracking-wide">Correo Electrónico</label>
                <input type="email" id="login-correo" required value="heber@ciodarofitness.com" class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-[#d4af37] text-white">
            </div>

            <div>
                <label class="text-xs text-gray-400 block mb-1 uppercase font-semibold tracking-wide">Contraseña</label>
                <input type="password" id="login-pass" required value="123456" class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-[#d4af37] text-white">
            </div>

            <button type="submit" class="w-full bg-gold-gradient hover:opacity-90 text-gray-950 font-black py-3.5 px-4 rounded-xl transition duration-200 shadow-lg uppercase tracking-wider text-sm mt-2">
                Acceder al Sistema
            </button>
        </form>
    </div>

    <div id="vista-panel" class="max-w-md w-full space-y-6 hidden pb-20">
        <header class="flex justify-between items-center bg-[#131b2e] p-4 rounded-2xl border border-gray-800">
            <div>
                <h1 class="text-base font-black tracking-wider text-white">BUSINESS CENTER <span class="text-gold">FIT</span></h1>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="cerrarSesion()" class="bg-gray-800 text-gray-300 px-3 py-1.5 rounded-xl border border-gray-700 text-xs hover:bg-gray-700">Salir</button>
                <span class="bg-[#d4af37]/10 text-gold border border-[#d4af37]/20 text-xs font-semibold px-3 py-1.5 rounded-full">Activo</span>
            </div>
        </header>

        <div class="grid grid-cols-2 gap-4">
            <div class="bg-[#131b2e] p-4 rounded-2xl border border-gray-800">
                <div class="text-xs text-gray-400 uppercase font-semibold">Clientes Activos</div>
                <div id="total-clientes" class="text-3xl font-bold mt-2 text-white">0</div>
            </div>
            <div class="bg-[#131b2e] p-4 rounded-2xl border border-gray-800">
                <div class="text-xs text-gray-400 uppercase font-semibold">Ingresos Mensuales</div>
                <div id="total-meta" class="text-2xl font-bold mt-2 text-gold">$0.00</div>
            </div>
        </div>

        <div class="bg-[#131b2e] p-5 rounded-2xl border border-gray-800 space-y-4">
            <h2 class="text-sm font-bold text-gold uppercase tracking-wide flex items-center gap-2">
                👤 Registrar Nuevo Cliente
            </h2>
            
            <form id="form-cliente" onsubmit="agregarCliente(event)" class="space-y-3">
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Nombre Completo</label>
                    <input type="text" id="nombre" required placeholder="Ej. Juan Pérez" class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-[#d4af37] text-white">
                </div>
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Número de WhatsApp (con código de país)</label>
                    <input type="text" id="whatsapp" required placeholder="Ej. 584123456789" class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-[#d4af37] text-white">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">Costo del Paquete ($)</label>
                        <input type="number" id="costo" required placeholder="Ej. 50" class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-[#d4af37] text-white">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">Fecha de Inicio</label>
                        <input type="date" id="fecha" required class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-[#d4af37] text-white">
                    </div>
                </div>
                <button type="submit" class="w-full bg-gold-gradient hover:opacity-90 text-gray-950 font-bold py-3.5 px-4 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-lg uppercase tracking-wider text-sm">
                    📂 Agregar a la Base de Datos
                </button>
            </form>
        </div>

        <div class="space-y-3">
            <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wide flex items-center gap-2">
                📋 Control de Clientes y Vencimientos
            </h3>
            <div id="lista-clientes" class="space-y-3"></div>
        </div>
    </div>

    <script>
        const inputFecha = document.getElementById('fecha');
        if (inputFecha) inputFecha.valueAsDate = new Date();

        let clientes = JSON.parse(localStorage.getItem('business_center_clientes')) || [];

        function realizarLogin(e) {
            e.preventDefault();
            document.getElementById('vista-login').classList.add('hidden');
            document.getElementById('vista-panel').classList.remove('hidden');
            document.body.classList.remove('flex', 'items-center', 'justify-center');
            renderizarClientes();
        }

        function cerrarSesion() {
            document.getElementById('vista-panel').classList.add('hidden');
            document.getElementById('vista-login').classList.remove('hidden');
            document.body.classList.add('flex', 'items-center', 'justify-center');
        }

        function agregarCliente(e) {
            e.preventDefault();
            
            const nuevoCliente = {
                id: Date.now(),
                nombre: document.getElementById('nombre').value,
                whatsapp: document.getElementById('whatsapp').value,
                costo: parseFloat(document.getElementById('costo').value) || 0,
                fecha: document.getElementById('fecha').value
            };

            clientes.push(nuevoCliente);
            localStorage.setItem('business_center_clientes', JSON.stringify(clientes));
            
            document.getElementById('form-cliente').reset();
            document.getElementById('fecha').valueAsDate = new Date();
            renderizarClientes();
        }

        function eliminarCliente(id) {
            if(confirm('¿Eliminar este cliente?')) {
                clientes = clientes.filter(c => c.id !== id);
                localStorage.setItem('business_center_clientes', JSON.stringify(clientes));
                renderizarClientes();
            }
        }

        function notificarCobro(whatsapp, nombre) {
            const mensaje = encodeURIComponent(`Hola ${nombre}, te escribo de Business Center Fit para recordarte el vencimiento de tu paquete.`);
            window.open(`https://wa.me/${whatsapp}?text=${mensaje}`, '_blank');
        }

        function renderizarClientes() {
            const contenedor = document.getElementById('lista-clientes');
            if (!contenedor) return;
            contenedor.innerHTML = '';
            
            let totalIngresos = 0;

            if (clientes.length === 0) {
                contenedor.innerHTML = `<div class="text-center text-gray-500 text-sm py-6 bg-[#131b2e] rounded-2xl border border-gray-800">No hay clientes registrados.</div>`;
                document.getElementById('total-clientes').textContent = '0';
                document.getElementById('total-meta').textContent = '$0.00';
                return;
            }

            clientes.forEach(c => {
                totalIngresos += c.costo;

                let fechaInicio = new Date(c.fecha + 'T00:00:00');
                let fechaVenc = new Date(fechaInicio);
                fechaVenc.setDate(fechaVenc.getDate() + 30);
                let opt = { day: '2-digit', month: 'short' };

                const card = document.createElement('div');
                card.className = "bg-[#131b2e] p-4 rounded-2xl border border-gray-800 space-y-3";
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-bold text-white text-base">${c.nombre}</h4>
                            <p class="text-xs text-gray-400 mt-0.5">📅 Ciclo: ${fechaInicio.toLocaleDateString('es-ES', opt)} al ${fechaVenc.toLocaleDateString('es-ES', opt)}</p>
                        </div>
                        <span class="text-gold font-bold text-sm">$${c.costo.toFixed(2)}</span>
                    </div>
                    <div class="flex justify-between items-center pt-2 border-t border-gray-800/60">
                        <span class="bg-[#d4af37]/10 text-gold border border-[#d4af37]/20 text-[10px] font-semibold px-2.5 py-1 rounded-full">
                            Activo (30d)
                        </span>
                        <div class="flex gap-2">
                            <button onclick="notificarCobro('${c.whatsapp}', '${c.nombre}')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3 py-2 rounded-xl transition flex items-center gap-1">
                                💬 Notificar Cobro
                            </button>
                            <button onclick="eliminarCliente(${c.id})" class="bg-gray-800 hover:bg-red-600/20 text-gray-400 hover:text-red-400 p-2 rounded-xl border border-gray-700">🗑️</button>
                        </div>
                    </div>
                `;
                contenedor.appendChild(card);
            });

            document.getElementById('total-clientes').textContent = clientes.length;
            document.getElementById('total-meta').textContent = '$' + totalIngresos.toFixed(2);
        }
    </script>
</body>
</html>
